name: openiq
x-database: &database
  DATABASE_BACKEND: "${DATABASE_BACKEND:-sqlite}"
  DATABASE_PATH: "${DATABASE_PATH:-/data/db.sqlite3}"
  DATABASE_NAME: "${DATABASE_NAME:-}"
  DATABASE_USER: "${DATABASE_USER:-}"
  DATABASE_PASSWORD: "${DATABASE_PASSWORD:-}"
  DATABASE_HOST: "${DATABASE_HOST:-localhost}"
  DATABASE_PORT: "${DATABASE_PORT:-5432}"
  DATABASE_SSLMODE: "${DATABASE_SSLMODE:-prefer}"
services:
  web:
    build: .
    image: openiq:local
    ports:
      - "${OPENIQ_BIND:-127.0.0.1}:${OPENIQ_PORT:-8765}:8000"
    environment:
      <<: *database
      DEBUG: "0"
      ALLOW_LOCAL_LOGIN: "${ALLOW_LOCAL_LOGIN:-0}"
      HTTPS: "${HTTPS:-0}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      SEED_DEMO: "${SEED_DEMO:-1}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-prototype-local-2026}"
      RUN_BACKEND_ADMIN_SETUP: "1"
      ENABLE_BACKEND_ADMIN: "${ENABLE_BACKEND_ADMIN:-1}"
      BACKEND_ADMIN_USERNAME: "${BACKEND_ADMIN_USERNAME:-openiq-admin}"
      DISCORD_CLIENT_ID: "${DISCORD_CLIENT_ID:-}"
      DISCORD_CLIENT_SECRET: "${DISCORD_CLIENT_SECRET:-}"
      DISCORD_REDIRECT_URI: "${DISCORD_REDIRECT_URI:-http://127.0.0.1:8765/auth/discord/callback/}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      ENABLE_DISCORD_DELIVERY: "${ENABLE_DISCORD_DELIVERY:-0}"
    volumes:
      - openiq-data:/data
    restart: unless-stopped
  scheduler:
    image: openiq:local
    profiles: [jobs]
    command: [python, manage.py, scheduler]
    environment:
      <<: *database
      RUN_MIGRATIONS: "0"
      SEED_DEMO: "0"
      RUN_BACKEND_ADMIN_SETUP: "0"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      ENABLE_DISCORD_DELIVERY: "${ENABLE_DISCORD_DELIVERY:-0}"
    volumes:
      - openiq-data:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped
  backup:
    image: openiq:local
    profiles: [backups]
    command: [python, manage.py, backup_scheduler, --output, /backups, --interval, "${BACKUP_INTERVAL:-86400}", --keep, "${BACKUP_KEEP:-7}", --timeout, "${BACKUP_TIMEOUT:-120}"]
    environment:
      <<: *database
      RUN_MIGRATIONS: "0"
      SEED_DEMO: "0"
      RUN_BACKEND_ADMIN_SETUP: "0"
    volumes:
      - openiq-data:/data
      - type: bind
        source: "${BACKUP_DIRECTORY:-./backups}"
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      disable: true
    stop_grace_period: 150s
    restart: unless-stopped
  bot:
    image: openiq:local
    profiles: [discord]
    command: [python, manage.py, runbot]
    environment:
      <<: *database
      RUN_MIGRATIONS: "0"
      SEED_DEMO: "0"
      RUN_BACKEND_ADMIN_SETUP: "0"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN:-}"
      ENABLE_DISCORD_DELIVERY: "${ENABLE_DISCORD_DELIVERY:-0}"
      DISCORD_SYNC_GLOBAL: "${DISCORD_SYNC_GLOBAL:-1}"
      DISCORD_SYNC_GUILD: "${DISCORD_SYNC_GUILD:-}"
    volumes:
      - openiq-data:/data
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, manage.py, runbot, --check]
      interval: 60s
      timeout: 20s
      start_period: 30s
      retries: 3
    restart: unless-stopped
volumes:
  openiq-data:
