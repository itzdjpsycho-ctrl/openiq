{% load static %}<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ session.title }} · Recap</title><link rel="stylesheet" href="{% static 'app.css' %}"><main class="content"><span class="eyebrow">PUBLIC WAR RECAP</span><h1>{{ session.title }}</h1><div class="stats"><article><small>Kills</small><strong>{{ summary.kills }}</strong></article><article><small>Deaths</small><strong>{{ summary.deaths }}</strong></article></div><table><thead><tr><th>Time</th><th>Action</th><th>Player</th><th>Target</th><th>Guild</th></tr></thead><tbody>{% for e in session.events %}<tr><td>{{ e.at }}</td><td>{{ e.kind }}</td><td>{{ e.player }}</td><td>{{ e.target }}</td><td>{{ e.guild }}</td></tr>{% endfor %}</tbody></table></main></html>
